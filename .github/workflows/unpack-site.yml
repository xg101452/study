name: Unpack 1.4.15 site bundle

on:
  workflow_dispatch:
  push:
    paths:
      - site-bundle-1.4.15.zip

permissions:
  contents: write

concurrency:
  group: unpack-site-1.4.15
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack site bundle
        run: |
          unzip -o site-bundle-1.4.15.zip -d .
          rm site-bundle-1.4.15.zip

      - name: Commit unpacked site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 1.4.15 去掉四道重复自测题、背诵册自测计数改为动态" || echo "no changes"
          git push