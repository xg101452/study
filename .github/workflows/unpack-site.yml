name: Unpack 1.4.13 site bundle

on:
  workflow_dispatch:
  push:
    paths:
      - site-bundle-1.4.13.zip

permissions:
  contents: write

concurrency:
  group: unpack-site-1.4.13
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack site bundle
        run: |
          unzip -o site-bundle-1.4.13.zip -d .
          rm site-bundle-1.4.13.zip

      - name: Commit unpacked site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 1.4.13 第四章 11 集逐集核对补缺、自测扩至 51 题、背诵册按章抽背与第四章同步" || echo "no changes"
          git push